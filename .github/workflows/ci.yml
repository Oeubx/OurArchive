name: OurArchive CI Gate

on:
  push:
    branches: ["main", "development", "staging"]
  pull_request:
    branches: ["main", "development", "staging"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ourarchive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-and-branch-integrity:
    name: Docs Integrity & Branch Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce Branch Flow
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "Validating PR branch flow: $HEAD -> $BASE"
          if [ "$BASE" = "main" ] && [ "$HEAD" != "staging" ] && [ "$HEAD" != "development" ]; then
            echo "Direct merges into main must originate from staging or development."
            exit 1
          fi
          if [ "$BASE" = "staging" ] && [ "$HEAD" != "development" ]; then
            echo "Only development can be merged into staging."
            exit 1
          fi

      - name: Audit Relative Paths in Documentation
        run: |
          echo "Scanning for hardcoded absolute local paths in Markdown files..."
          if grep -rIn "C:\\\\" docs/ || grep -rIn "D:\\\\" docs/; then
            echo "ERROR: Hardcoded absolute drive paths found in documentation. Please use relative paths."
            exit 1
          else
            echo "Relative path audit passed. No hardcoded Windows drive letters found."
          fi

      - name: Validate Markdown Relative Links
        run: |
          echo "Auditing internal markdown links..."
          python3 - << 'PY'
          import os, re, sys

          broken_links = []
          link_pattern = re.compile(r'\[([^\]]+)\]\(([^)]+)\)')

          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root:
                  continue
              for file in files:
                  if file.endswith('.md'):
                      file_path = os.path.join(root, file)
                      with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      for text, link in link_pattern.findall(content):
                          if link.startswith('http://') or link.startswith('https://') or link.startswith('#') or link.startswith('mailto:'):
                              continue
                          # Strip anchor
                          clean_link = link.split('#')[0]
                          if not clean_link:
                              continue
                          target_path = os.path.normpath(os.path.join(root, clean_link))
                          if not os.path.exists(target_path):
                              # Check if referenced as in-progress
                              broken_links.append((file_path, link, target_path))

          if broken_links:
              print(f"Warning: {len(broken_links)} unresolvable local links found:")
              for src, link, tgt in broken_links:
                  print(f"  {src} -> '{link}' (resolves to: {tgt})")
              # Do not fail if documents are marked in-progress
              print("Permitted for initial bootstrap phase.")
          else:
              print("All local markdown links validated successfully!")
          PY
