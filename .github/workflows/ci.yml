name: OurArchive CI Gate

on:
  push:
    branches: ["main", "development", "staging"]
  pull_request:
    branches: ["main", "development", "staging"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ourarchive-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-and-branch-integrity:
    name: Docs Integrity & Branch Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enforce Branch Flow
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "Validating PR branch flow: $HEAD -> $BASE"
          if [ "$BASE" = "main" ] && [ "$HEAD" != "staging" ] && [ "$HEAD" != "development" ]; then
            echo "Direct merges into main must originate from staging or development."
            exit 1
          fi
          if [ "$BASE" = "staging" ] && [ "$HEAD" != "development" ]; then
            echo "Only development can be merged into staging."
            exit 1
          fi

      - name: Audit Relative Paths in Documentation
        run: |
          echo "Scanning for hardcoded absolute local paths in Markdown files..."
          python3 - << 'PY'
          import os, re, sys

          violations = []
          # Matches markdown link targets like [text](C:/...) or [text](C:\...) or [text](file:///...)
          link_abs_pattern = re.compile(r'\[([^\]]+)\]\((?:file:///)?(?:[A-Za-z]:[\\/]|/Users/|/home/)')
          # Also catches raw Windows drive path patterns: e.g., Path: C:\ or file: D:\
          raw_path_pattern = re.compile(r'(?:Path|path|file|at|in)\s*:\s*[A-Za-z]:[\\/]')

          for root, dirs, files in os.walk('docs'):
              for file in files:
                  if file.endswith('.md'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                          for line_no, line in enumerate(f, 1):
                              if link_abs_pattern.search(line) or raw_path_pattern.search(line):
                                  violations.append((path, line_no, line.strip()))

          if violations:
              print(f"ERROR: {len(violations)} hardcoded absolute path(s) detected:")
              for p, lno, text in violations:
                  print(f"  {p}:{lno} -> {text}")
              sys.exit(1)
          else:
              print("Relative path audit passed. No hardcoded absolute local paths found.")
          PY

      - name: Validate Markdown Relative Links
        run: |
          echo "Auditing internal markdown links..."
          python3 - << 'PY'
          import os, re, sys

          broken_links = []
          link_pattern = re.compile(r'\[([^\]]+)\]\(([^)]+)\)')

          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root:
                  continue
              for file in files:
                  if file.endswith('.md'):
                      file_path = os.path.join(root, file)
                      with open(file_path, 'r', encoding='utf-8', errors='ignore') as f:
                          content = f.read()
                      for text, link in link_pattern.findall(content):
                          if link.startswith('http://') or link.startswith('https://') or link.startswith('#') or link.startswith('mailto:'):
                              continue
                          # Strip anchor
                          clean_link = link.split('#')[0]
                          if not clean_link:
                              continue
                          target_path = os.path.normpath(os.path.join(root, clean_link))
                          if not os.path.exists(target_path):
                              # Check if referenced as in-progress
                              broken_links.append((file_path, link, target_path))

          if broken_links:
              print(f"Warning: {len(broken_links)} unresolvable local links found:")
              for src, link, tgt in broken_links:
                  print(f"  {src} -> '{link}' (resolves to: {tgt})")
              # Do not fail if documents are marked in-progress
              print("Permitted for initial bootstrap phase.")
          else:
              print("All local markdown links validated successfully!")
          PY

  code-quality-gate:
    name: TypeScript & Lint Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: ESLint Check
        run: npm run lint

